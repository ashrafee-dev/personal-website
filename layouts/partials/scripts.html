<script src="{{ "script.js" | relURL }}"></script>
<script>
  const updateTime = () => {
    const target = document.getElementById("current-time");
    if (target) target.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  };
  updateTime();
  setInterval(updateTime, 60000);
</script>
